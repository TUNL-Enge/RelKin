[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nuclear-kinematics"
version = "0.2.0"
description = "Relativistic kinematics calculator for two-body nuclear reactions"
requires-python = ">=3.9"
dependencies = [
    "vector",
    "hepunits",
    "numpy",
    "scipy",
    "PySide6",
    "matplotlib",
]

[project.scripts]
nuclear-kinematics = "nuclear_kinematics.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["nuclear_kinematics*"]

[tool.setuptools.package-data]
"nuclear_kinematics.data" = ["*.csv"]
"nuclear_kinematics.gui" = ["*.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]
